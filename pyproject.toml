[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voltammoman"
dynamic = ["version"]
description = "Batch evaluation of cyclic voltammograms (peak potentials, peak currents, reversibility) from NOVA exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Baláž" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "openpyxl>=3.0",
]
keywords = ["cyclic voltammetry", "electrochemistry", "peak detection", "NOVA", "Autolab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/LLapsus/VoltammoMan"
Issues = "https://github.com/LLapsus/VoltammoMan/issues"

[project.optional-dependencies]
gui = ["gradio>=4.0"]
test = ["pytest>=7"]

[project.scripts]
vom = "voltammoman.cli:main"

[tool.setuptools.dynamic]
version = { attr = "voltammoman.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
